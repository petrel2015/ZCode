<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#242424"/>
      <stop offset="0.5" stop-color="#191919"/>
      <stop offset="1" stop-color="#0d0d0d"/>
    </linearGradient>
    <linearGradient id="glyph" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e8e8e8"/>
    </linearGradient>
    <linearGradient id="slashRed" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e53935"/>
      <stop offset="1" stop-color="#b71c1c"/>
    </linearGradient>
    <clipPath id="tile"><rect x="0" y="0" width="1024" height="1024" rx="230"/></clipPath>
    <clipPath id="glyphClip"><path d="M0,0 L560,0 L560,120 L150,440 L560,440 L560,560 L0,560 L0,440 L410,120 L0,120 Z"/></clipPath>
    <mask id="bgOnly">
      <rect x="0" y="0" width="1024" height="1024" fill="white"/>
      <g transform="translate(512,512) skewX(-12) translate(-280,-280)">
        <path d="M0,0 L560,0 L560,120 L150,440 L560,440 L560,560 L0,560 L0,440 L410,120 L0,120 Z" fill="black"/>
      </g>
      <g transform="translate(512,500) rotate(-6)">
        <path d="M-310.0,-29.0 L220.0,-29.0 L310.0,0.0 L-220.0,29.0 L-258.0,9.0 L-214.0,2.0 L-284.0,-2.0 L-304.0,7.0 L-294.0,0.0 Z" fill="black" stroke="black" stroke-width="60"/>
      </g>
    </mask>
  </defs>

  <rect x="0" y="0" width="1024" height="1024" rx="230" fill="url(#bg)"/>

  <g clip-path="url(#tile)">
    

    <!-- Z 字：居中 + 斜体 -->
    <g transform="translate(512,512) skewX(-12) translate(-280,-280)">
      <path d="M0,0 L560,0 L560,120 L150,440 L560,440 L560,560 L0,560 L0,440 L410,120 L0,120 Z" fill="url(#glyph)"/>
      <!-- 两道与笔画平行的切缝（解构感，复刻原图标）：切断上杠/对角、对角/下杠的接缝 -->
      <rect x="70.0" y="121.0" width="660" height="18" fill="#141414" clip-path="url(#glyphClip)" transform="rotate(-37.97 400 130)"/>
      <rect x="-170.0" y="421.0" width="660" height="18" fill="#141414" clip-path="url(#glyphClip)" transform="rotate(-37.97 160 430)"/>
      <g clip-path="url(#glyphClip)"></g>
    </g>

    <!-- 叛忍横道 -->
    <g transform="translate(512,500) rotate(-6)">
      <path d="M-310.0,-29.0 L220.0,-29.0 L310.0,0.0 L-220.0,29.0 L-258.0,9.0 L-214.0,2.0 L-284.0,-2.0 L-304.0,7.0 L-294.0,0.0 Z" fill="#ffffff" stroke="#0f0f0f" stroke-width="14" stroke-linejoin="miter"/>
    </g>
    

    
  </g>
</svg>